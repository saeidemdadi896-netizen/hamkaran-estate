services:
  - type: web
    name: hamkaran-estate
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: hamkaran-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: hamkaran-db
    plan: free

{% extends 'estate/base.html' %}{% block content %}<section class="form-wrap"><h1>{{ title }}</h1><form method="post">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field }}{% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}</label>{% endfor %}{% for error in form.non_field_errors %}<p class="error">{{ error }}</p>{% endfor %}<button>ثبت اطلاعات</button></form></section>{% endblock %}

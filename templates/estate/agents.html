{% extends 'estate/base.html' %}{% block content %}<h1>مشاوران عضو</h1><form class="filters"><input name="q" value="{{ q }}" placeholder="نام، شهر یا تخصص"><button>جست‌وجو</button></form><div class="grid">{% for a in agents %}<article class="item">{% if a.portrait_url %}<img class="portrait" src="{{ a.portrait_url }}" alt="{{ a.full_name }}">{% endif %}<p class="eyebrow">{{ a.city }} · {{ a.experience_years }} سال سابقه</p><h3><a href="{% url 'agent_detail' a.pk %}">{{ a.full_name }}</a></h3><p>{{ a.specialties|default:"مشاور املاک" }}</p></article>{% empty %}<p>مشاوری یافت نشد.</p>{% endfor %}</div>{% endblock %}
